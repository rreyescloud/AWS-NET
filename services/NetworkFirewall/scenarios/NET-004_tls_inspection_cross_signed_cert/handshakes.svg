<text x="630.0" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#2E8B2E">SYN-ACK (seq=300, ack=101)</text>
<text x="630.0" y="376" text-anchor="middle" font-size="13" font-weight="400" fill="#232F3E">“Yes, go ahead”</text>
<path d="M266,450 L994,450" fill="none" stroke="#1F6FB8" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#e1F6FB8)"/>
<circle cx="300" cy="450" r="16" fill="#1F6FB8" stroke="#FFFFFF" stroke-width="2.5"/>
