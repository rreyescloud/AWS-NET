<text x="630.0" y="436" text-anchor="middle" font-size="15" font-weight="700" fill="#1F6FB8">ACK (seq=101, ack=301)</text>
<text x="630.0" y="476" text-anchor="middle" font-size="13" font-weight="400" fill="#232F3E">“Confirmed, we are connected”</text>
<rect x="260" y="590" width="740" height="60" rx="8" fill="#EEF7EE" stroke="#2E8B2E" stroke-width="2"/>
<text x="630.0" y="624.9" text-anchor="middle" font-size="15" font-weight="700" fill="#2E8B2E">TCP connection established — ready for the TLS handshake</text>
<rect x="1100" y="200" width="470" height="160" rx="8" fill="#FFF5EB" stroke="#E07B00" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="1335.0" y="230" text-anchor="middle" font-size="15" font-weight="700" fill="#E07B00">Layer 4 — transport</text>
<text x="1335.0" y="258" text-anchor="middle" font-size="14" font-weight="400" fill="#232F3E">Everything in plain text (no encryption)</text>
<text x="1335.0" y="276" text-anchor="middle" font-size="14" font-weight="400" fill="#232F3E">Defines source/destination IPs and ports</text>
<text x="1335.0" y="294" text-anchor="middle" font-size="14" font-weight="400" fill="#232F3E">Network Firewall sees: IPs + ports</text>
<text x="1335.0" y="312" text-anchor="middle" font-size="14" font-weight="400" fill="#232F3E">Stateless / stateful rules can filter here</text>
