<path d="M266,250 L994,250" fill="none" stroke="#1F6FB8" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#e1F6FB8)"/>
<circle cx="300" cy="250" r="16" fill="#1F6FB8" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="300" y="256" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">1</text>
<rect x="570" y="219" width="119" height="23" rx="4" fill="#FFFFFF" fill-opacity="0.92"/>
<text x="630.0" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#1F6FB8">SYN (seq=100)</text>
<text x="630.0" y="276" text-anchor="middle" font-size="13" font-weight="400" fill="#232F3E">“Can I connect?”</text>
<path d="M994,350 L266,350" fill="none" stroke="#2E8B2E" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#e2E8B2E)"/>
<circle cx="960" cy="350" r="16" fill="#2E8B2E" stroke="#FFFFFF" stroke-width="2.5"/>
