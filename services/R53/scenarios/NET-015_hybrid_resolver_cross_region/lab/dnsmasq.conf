# dnsmasq configuration — simulates on-premises Active Directory DNS
# Serves the corp.example.com zone for the hybrid resolver lab

# Listen on all interfaces, port 53
listen-address=0.0.0.0
port=53

# Do not use /etc/resolv.conf — this server is authoritative only
no-resolv

# Do not forward unresolved queries upstream
bogus-priv
domain-needed

# Log all queries (useful for debugging the forwarding chain)
log-queries
log-facility=/var/log/dnsmasq.log

# ── corp.example.com zone ──

# Domain controllers
address=/dc1.corp.example.com/192.168.1.10
address=/dc2.corp.example.com/192.168.1.11

# File server
address=/filesvr.corp.example.com/192.168.10.50

# VPN concentrator
address=/vpn.corp.example.com/192.168.20.1

# Mail server
address=/mail.corp.example.com/192.168.30.10

# Intranet
address=/intranet.corp.example.com/192.168.40.80

# SRV record for AD LDAP (this response is large enough to trigger TCP fallback
# when combined with additional records — Exercise 3)
srv-host=_ldap._tcp.corp.example.com,dc1.corp.example.com,389,10,0
srv-host=_ldap._tcp.corp.example.com,dc2.corp.example.com,389,10,0

# TXT record (SPF — intentionally long to test TCP fallback)
txt-record=corp.example.com,"v=spf1 ip4:192.168.0.0/16 ip4:10.0.0.0/8 include:_spf.google.com include:spf.protection.outlook.com include:amazonses.com ~all"

# SOA for the zone (makes dnsmasq authoritative)
auth-zone=corp.example.com
auth-soa=corp.example.com,dns.corp.example.com,1,3600,900,604800,300
